name: Build ProtoPirateTX FAP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ufbt
        run: |
          pip install ufbt
          ufbt setup
      - name: Build
        run: |
          cd ProtoPirateTX
          ufbt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ProtoPirateTX
          path: |
            ProtoPirateTX/build/**/*.fap
            ProtoPirateTX/dist/**/*.fap
          if-no-files-found: ignore
