name: Build ProtoPirateTX FAP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ufbt
        run: |
          pip install ufbt
          ufbt setup
      - name: Build
        run: ufbt 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: grep -i error build.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: ProtoPirateTX
          path: build/**/*.fap
          if-no-files-found: ignore
