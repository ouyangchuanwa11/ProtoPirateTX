name: Build ProtoPirateTX FAP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ufbt
        run: |
          pip install ufbt
          ufbt setup
      - name: Move files to root
        run: |
          rm -f application.fam protopirate_decoder.c protopirate_icon.png 2>/dev/null || true
          cp ProtoPirateTX/*.c .
          cp ProtoPirateTX/*.h .
          cp ProtoPirateTX/application.fam .
      - name: Build
        run: ufbt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ProtoPirateTX
          path: |
            build/**/*.fap
            dist/**/*.fap
          if-no-files-found: ignore
